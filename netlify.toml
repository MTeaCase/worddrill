# Netlify 配置：只部署一个静态说明页 + 两个函数，不构建 Android 工程
[build]
  publish = "netlify/public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# 对外路径统一走 /api/*，内部转发到 /.netlify/functions/*
[[redirects]]
  from = "/api/smart-parse"
  to = "/.netlify/functions/smart-parse"
  status = 200
  force = true

[[redirects]]
  from = "/api/example"
  to = "/.netlify/functions/example"
  status = 200
  force = true
