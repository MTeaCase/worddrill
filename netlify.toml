# Netlify 配置：只部署一个静态说明页 + 一个函数，不构建 Android 工程
[build]
  publish = "netlify/public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# 函数在代码里声明了 config.path = /api/smart-parse，这里再兜一层
[[redirects]]
  from = "/api/smart-parse"
  to = "/.netlify/functions/smart-parse"
  status = 200
  force = true
